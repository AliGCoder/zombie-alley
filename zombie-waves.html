<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zombie Waves</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---------- Input ----------
const keys = {};
const mouse = { x: W / 2, y: H / 2, down: false };
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'r') startReload();
  if (e.key === 'Enter' && (state === 'menu' || state === 'over')) newGame();
  if (e.key.toLowerCase() === 'p' && (state === 'play' || state === 'paused')) state = state === 'play' ? 'paused' : 'play';
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', () => {
  mouse.down = true;
  if (state === 'menu' || state === 'over') newGame();
});
addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ---------- Game state ----------
let state = 'menu';
let player, bullets, zombies, particles, pickups, texts;
let wave, toSpawn, spawnTimer, breakTimer, score, kills, shake, best = 0;
try { best = +localStorage.getItem('zw-best') || 0; } catch (e) {}

const ZOMBIE_TYPES = {
  walker: { r: 16, speed: 70,  hp: 3,  dmg: 10, color: '#5a9e4b', points: 10 },
  runner: { r: 12, speed: 140, hp: 1,  dmg: 6,  color: '#b5c94a', points: 15 },
  brute:  { r: 28, speed: 45,  hp: 14, dmg: 25, color: '#3f6b3a', points: 50 },
};

function newGame() {
  player = { x: W / 2, y: H / 2, r: 15, hp: 100, maxHp: 100, speed: 230,
             ammo: 12, mag: 12, reloading: 0, fireCd: 0, hurtFlash: 0 };
  bullets = []; zombies = []; particles = []; pickups = []; texts = [];
  wave = 0; score = 0; kills = 0; shake = 0;
  startWave();
  state = 'play';
}

function startWave() {
  wave++;
  toSpawn = 5 + wave * 3;
  spawnTimer = 0;
  breakTimer = 0;
  floatText(W / 2, H / 2 - 80, 'WAVE ' + wave, '#ff5544', 40, 2);
}

function pickType() {
  const r = Math.random();
  if (wave >= 4 && r < Math.min(0.08 + wave * 0.01, 0.2)) return 'brute';
  if (wave >= 2 && r < 0.35) return 'runner';
  return 'walker';
}

function spawnZombie() {
  const t = ZOMBIE_TYPES[pickType()];
  const side = Math.floor(Math.random() * 4), m = 40;
  let x, y;
  if (side === 0) { x = Math.random() * W; y = -m; }
  else if (side === 1) { x = W + m; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + m; }
  else { x = -m; y = Math.random() * H; }
  const scale = 1 + (wave - 1) * 0.06; // waves get tougher
  const hp = Math.ceil(t.hp * (1 + (wave - 1) * 0.15));
  zombies.push({ x, y, r: t.r, speed: t.speed * Math.min(scale, 1.8) * (0.85 + Math.random() * 0.3),
                 hp, maxHp: hp, dmg: t.dmg, color: t.color, points: t.points,
                 wobble: Math.random() * 6, hitFlash: 0 });
}

function startReload() {
  if (state !== 'play' || player.reloading > 0 || player.ammo === player.mag) return;
  player.reloading = 1.2;
}

function shoot() {
  const a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  const spread = (Math.random() - 0.5) * 0.06;
  bullets.push({ x: player.x + Math.cos(a) * 22, y: player.y + Math.sin(a) * 22,
                 vx: Math.cos(a + spread) * 900, vy: Math.sin(a + spread) * 900, life: 1 });
  player.ammo--;
  player.fireCd = 0.14;
  shake = Math.max(shake, 3);
  for (let i = 0; i < 4; i++) particles.push({ x: player.x + Math.cos(a) * 24, y: player.y + Math.sin(a) * 24,
    vx: Math.cos(a + (Math.random() - .5)) * 200, vy: Math.sin(a + (Math.random() - .5)) * 200,
    life: 0.12, max: 0.12, color: '#ffd35a', size: 3 });
  if (player.ammo === 0) startReload();
}

function blood(x, y, n, color = '#8b1a1a') {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 50 + Math.random() * 220;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.4 + Math.random() * 0.4, max: 0.8, color, size: 2 + Math.random() * 3 });
  }
}

function floatText(x, y, text, color, size = 16, life = 0.8) {
  texts.push({ x, y, text, color, size, life, max: life });
}

// ---------- Update ----------
function update(dt) {
  if (state !== 'play') return;
  const p = player;

  // Movement
  let mx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  let my = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  const len = Math.hypot(mx, my) || 1;
  p.x = Math.max(p.r, Math.min(W - p.r, p.x + mx / len * p.speed * dt));
  p.y = Math.max(p.r, Math.min(H - p.r, p.y + my / len * p.speed * dt));

  // Shooting / reload
  p.fireCd -= dt;
  p.hurtFlash = Math.max(0, p.hurtFlash - dt);
  if (p.reloading > 0) {
    p.reloading -= dt;
    if (p.reloading <= 0) { p.reloading = 0; p.ammo = p.mag; }
  } else if (mouse.down && p.fireCd <= 0 && p.ammo > 0) shoot();

  // Wave spawning
  if (toSpawn > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnZombie(); toSpawn--;
      spawnTimer = Math.max(0.25, 1.1 - wave * 0.07);
    }
  } else if (zombies.length === 0) {
    if (breakTimer === 0) {
      breakTimer = 4;
      const bonus = wave * 100;
      score += bonus;
      floatText(W / 2, H / 2 - 40, 'WAVE CLEARED! +' + bonus, '#7dff7d', 28, 2);
      p.hp = Math.min(p.maxHp, p.hp + 20);
    }
    breakTimer -= dt;
    if (breakTimer <= 0) startWave();
  }

  // Bullets
  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; }
  bullets = bullets.filter(b => b.life > 0 && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

  // Zombies
  for (const z of zombies) {
    const a = Math.atan2(p.y - z.y, p.x - z.x);
    z.wobble += dt * 8;
    const wob = Math.sin(z.wobble) * 0.4;
    z.x += Math.cos(a + wob) * z.speed * dt;
    z.y += Math.sin(a + wob) * z.speed * dt;
    z.angle = a;
    z.hitFlash = Math.max(0, z.hitFlash - dt);

    // Hit by bullet
    for (const b of bullets) {
      if (b.life > 0 && Math.hypot(b.x - z.x, b.y - z.y) < z.r + 3) {
        b.life = 0; z.hp--; z.hitFlash = 0.08;
        z.x += b.vx * 0.006; z.y += b.vy * 0.006; // knockback
        blood(b.x, b.y, 5);
      }
    }

    // Touch player
    const d = Math.hypot(p.x - z.x, p.y - z.y);
    if (d < z.r + p.r) {
      if (p.hurtFlash <= 0) {
        p.hp -= z.dmg; p.hurtFlash = 0.5; shake = 10;
        blood(p.x, p.y, 10, '#c22');
        if (p.hp <= 0) gameOver();
      }
      // push apart
      const push = (z.r + p.r - d) / 2;
      z.x -= Math.cos(a) * push; z.y -= Math.sin(a) * push;
    }
  }

  // Zombies don't stack on each other
  for (let i = 0; i < zombies.length; i++) for (let j = i + 1; j < zombies.length; j++) {
    const a = zombies[i], b = zombies[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, min = a.r + b.r;
    if (d < min) { const o = (min - d) / 2; a.x -= dx / d * o; a.y -= dy / d * o; b.x += dx / d * o; b.y += dy / d * o; }
  }

  // Deaths
  zombies = zombies.filter(z => {
    if (z.hp > 0) return true;
    score += z.points * wave; kills++;
    blood(z.x, z.y, 20);
    floatText(z.x, z.y - z.r, '+' + z.points * wave, '#fff');
    if (Math.random() < 0.08) pickups.push({ x: z.x, y: z.y, life: 10 });
    return false;
  });

  // Pickups (health)
  for (const k of pickups) {
    k.life -= dt;
    if (Math.hypot(k.x - p.x, k.y - p.y) < p.r + 12) {
      k.life = 0; p.hp = Math.min(p.maxHp, p.hp + 25);
      floatText(p.x, p.y - 25, '+25 HP', '#7dff7d');
    }
  }
  pickups = pickups.filter(k => k.life > 0);

  // Particles & text
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.9; q.vy *= 0.9; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
  for (const t of texts) { t.y -= 30 * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);
  shake *= 0.85;
}

function gameOver() {
  state = 'over';
  if (score > best) { best = score; try { localStorage.setItem('zw-best', best); } catch (e) {} }
}

// ---------- Draw ----------
function draw() {
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  // Ground
  ctx.fillStyle = '#2a2a22'; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.strokeStyle = '#33332a'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 64) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  if (state === 'menu') { ctx.restore(); drawMenu(); return; }

  // Pickups
  for (const k of pickups) {
    if (k.life < 3 && Math.floor(k.life * 8) % 2) continue;
    ctx.fillStyle = '#fff'; ctx.fillRect(k.x - 10, k.y - 10, 20, 20);
    ctx.fillStyle = '#d22'; ctx.fillRect(k.x - 3, k.y - 8, 6, 16); ctx.fillRect(k.x - 8, k.y - 3, 16, 6);
  }

  // Particles
  for (const q of particles) {
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color; ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;

  // Zombies
  for (const z of zombies) {
    ctx.save(); ctx.translate(z.x, z.y); ctx.rotate(z.angle || 0);
    // arms
    ctx.fillStyle = z.hitFlash > 0 ? '#fff' : z.color;
    ctx.fillRect(z.r * 0.3, -z.r * 0.85, z.r * 1.1, z.r * 0.35);
    ctx.fillRect(z.r * 0.3, z.r * 0.5, z.r * 1.1, z.r * 0.35);
    ctx.beginPath(); ctx.arc(0, 0, z.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e33';
    ctx.beginPath(); ctx.arc(z.r * 0.45, -z.r * 0.3, z.r * 0.15, 0, 7); ctx.arc(z.r * 0.45, z.r * 0.3, z.r * 0.15, 0, 7); ctx.fill();
    ctx.restore();
    if (z.hp < z.maxHp) {
      ctx.fillStyle = '#400'; ctx.fillRect(z.x - z.r, z.y - z.r - 10, z.r * 2, 4);
      ctx.fillStyle = '#e33'; ctx.fillRect(z.x - z.r, z.y - z.r - 10, z.r * 2 * z.hp / z.maxHp, 4);
    }
  }

  // Bullets
  ctx.strokeStyle = '#ffe680'; ctx.lineWidth = 3;
  for (const b of bullets) { ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.015, b.y - b.vy * 0.015); ctx.stroke(); }

  // Player
  const p = player, a = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(a);
  ctx.fillStyle = '#222'; ctx.fillRect(8, -3, 20, 6); // gun
  ctx.fillStyle = p.hurtFlash > 0 && Math.floor(p.hurtFlash * 20) % 2 ? '#f66' : '#3b82f6';
  ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(3, 0, 8, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // Floating text
  ctx.textAlign = 'center';
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life / t.max * 2);
    ctx.font = `bold ${t.size}px system-ui`; ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHUD();
  if (state === 'paused') overlay('PAUSED', 'Press P to resume');
  if (state === 'over') overlay('YOU DIED', `Wave ${wave}  ·  Kills ${kills}  ·  Score ${score}  ·  Best ${best}`, 'Click or press Enter to play again');
}

function drawHUD() {
  const p = player;
  ctx.textAlign = 'left';
  // Health bar
  ctx.fillStyle = '#000a'; ctx.fillRect(16, 16, 224, 26);
  ctx.fillStyle = p.hp > 30 ? '#3c3' : '#e33'; ctx.fillRect(18, 18, 220 * Math.max(0, p.hp) / p.maxHp, 22);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px system-ui'; ctx.fillText('HP ' + Math.max(0, p.hp), 26, 34);
  // Wave / score
  ctx.font = 'bold 20px system-ui';
  ctx.fillText('Wave ' + wave, 16, 70);
  ctx.font = '16px system-ui';
  ctx.fillText('Score ' + score, 16, 94);
  ctx.fillText('Zombies left ' + (zombies.length + toSpawn), 16, 116);
  // Ammo
  ctx.textAlign = 'right'; ctx.font = 'bold 22px system-ui';
  ctx.fillText(p.reloading > 0 ? 'RELOADING...' : `${p.ammo} / ${p.mag}`, W - 20, H - 24);
  if (p.reloading > 0) {
    ctx.fillStyle = '#000a'; ctx.fillRect(W - 170, H - 16, 150, 6);
    ctx.fillStyle = '#ffd35a'; ctx.fillRect(W - 170, H - 16, 150 * (1 - p.reloading / 1.2), 6);
  }
  // Break countdown
  if (breakTimer > 0) {
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 22px system-ui';
    ctx.fillText('Next wave in ' + Math.ceil(breakTimer), W / 2, 50);
  }
}

function overlay(title, line1, line2) {
  ctx.fillStyle = '#000b'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ff5544'; ctx.font = 'bold 64px system-ui';
  ctx.fillText(title, W / 2, H / 2 - 30);
  ctx.fillStyle = '#fff'; ctx.font = '20px system-ui';
  ctx.fillText(line1, W / 2, H / 2 + 20);
  if (line2) { ctx.fillStyle = '#aaa'; ctx.fillText(line2, W / 2, H / 2 + 56); }
}

function drawMenu() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff5544'; ctx.font = 'bold 72px system-ui';
  ctx.fillText('ZOMBIE WAVES', W / 2, H / 2 - 80);
  ctx.fillStyle = '#fff'; ctx.font = '20px system-ui';
  ctx.fillText('WASD / Arrows to move  ·  Mouse to aim  ·  Hold click to shoot', W / 2, H / 2 - 10);
  ctx.fillText('R to reload  ·  P to pause', W / 2, H / 2 + 20);
  ctx.fillStyle = '#7dff7d'; ctx.font = 'bold 26px system-ui';
  ctx.fillText('Click or press Enter to start', W / 2, H / 2 + 80);
  if (best) { ctx.fillStyle = '#aaa'; ctx.font = '16px system-ui'; ctx.fillText('Best score: ' + best, W / 2, H / 2 + 120); }
}

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
